name: Sync church calendar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-calendar.yml'

permissions:
  contents: write

concurrency:
  group: church-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh the next six weeks from Google Calendar
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { loadCalendarEvents } from './src/lib/sunday-agenda.mjs';

          const settings = JSON.parse(readFileSync('src/content/sunday/current.json', 'utf8'));
          const snapshot = 'src/content/sunday/calendar-snapshot.json';
          const events = await loadCalendarEvents(settings.calendarUrl);
          if (events === null) {
            throw new Error('Google Calendar is unavailable. Keeping the previous calendar.');
          }

          const previous = JSON.parse(readFileSync(snapshot, 'utf8'));
          if (JSON.stringify(previous) === JSON.stringify(events)) {
            console.log('Calendar is unchanged.');
          } else {
            writeFileSync(snapshot, JSON.stringify(events, null, 2) + '\n');
          }
          EOF
      - name: Publish only when the events change
        run: |
          if git diff --quiet -- src/content/sunday/calendar-snapshot.json; then
            echo "No new deployment needed."
            exit 0
          fi
          git config user.name "ICBC Calendar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/sunday/calendar-snapshot.json
          git commit -m "Sync upcoming church calendar events"
          git push origin main
