backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: images/uploads

site_url: https://irvingcollege.church
display_url: https://irvingcollege.church

collections:
  - name: potluck
    label: Potluck Settings
    files:
      - name: potluck
        label: Current Potluck
        file: src/content/potluck/potluck.md
        fields:
          - label: Event Title
            name: title
            widget: string
            default: "Church Potluck"

          - label: Event Date
            name: date
            widget: datetime
            date_format: "YYYY-MM-DD"
            time_format: false

          - label: Event Description
            name: description
            widget: text
            hint: "Tell everyone about the potluck."

          - label: Accepting Signups
            name: acceptingSignups
            widget: boolean
            default: true
            hint: "Turn off to close registration."
  - name: meal
    label: Wednesday Meal
    files:
      - name: meal
        label: This Week's Menu
        file: src/content/meal/meal.md
        fields:
          - { label: Show Menu, name: showMenu, widget: boolean, default: true }
          - { label: Meal Title, name: title, widget: string, hint: "Example: Spaghetti Dinner" }
          - label: "Meal Image"
            name: "image"
            widget: "image"
            required: false
          - { label: Menu Details, name: menu, widget: text, hint: "Example: Spaghetti, salad, garlic bread, and dessert" }
          - { label: Optional Note, name: note, widget: text, required: false, hint: "Example: Donations are appreciated." }

  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: src/content/homepage/homepage.md
        fields:
          - label: Church Name
            name: churchName
            widget: string

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Visit Button Text, name: visitButtonText, widget: string }
              - { label: Sermon Button Text, name: sermonButtonText, widget: string }

          - label: Plan Your Visit
            name: planvisit
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Image, name: image, widget: image, required: false }

          - label: Mission
            name: mission
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Button Text, name: buttonText, widget: string }

          - label: Ministries
            name: ministries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Ministry Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Image, name: image, widget: image }

          - label: Giving
            name: giving
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button Text, name: buttonText, widget: string }
              - { label: Giving URL, name: url, widget: string }

          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Address, name: address, widget: string }
              - { label: City, State and ZIP, name: cityStateZip, widget: string }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }

  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Time, name: time, widget: string }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Description, name: description, widget: text }
      - { label: Image, name: image, widget: image, required: false }

  - name: bulletin
    label: Weekly Bulletin
    files:
      - name: current
        label: Current Bulletin
        file: public/bulletin/current.json
        fields:
          - { label: Bulletin Title, name: title, widget: string, default: "This Week's Bulletin" }
          - { label: Bulletin Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
          - { label: Bulletin text for the Sunday app, name: text, widget: text, required: false, hint: "Shown directly on the Sunday app. Use blank lines between announcements." }
          - label: Wide banners
            name: banners
            widget: list
            required: false
            fields:
              - { label: Banner PNG, name: image, widget: image, hint: "Upload a 1560 × 450 PNG." }
              - { label: Banner description, name: description, widget: string, hint: "Include the key information shown in the image." }
              - { label: Optional page link, name: url, widget: string, required: false, hint: "Use an HTTPS link or a church website path like /shirts." }
          - label: Announcement cards
            name: announcements
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Details, name: text, widget: text, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image description, name: imageAlt, widget: string, required: false }
              - { label: Button text, name: buttonLabel, widget: string, required: false, hint: "Examples: Sign up or Order a shirt." }
              - { label: Button link, name: buttonUrl, widget: string, required: false, hint: "Paste an HTTPS link or a church website path like /shirts." }

  - name: sunday_app
    label: Sunday App
    files:
      - name: current
        label: This Sunday
        file: src/content/sunday/current.json
        fields:
          - { label: Message title, name: title, widget: string }
          - { label: Service date (YYYY-MM-DD), name: date, widget: string, required: false }
          - { label: Past sermons link, name: watchUrl, widget: string, required: false }
          - { label: Tithe.ly giving link, name: givingUrl, widget: string, required: false }
          - label: Scripture passages
            name: scriptures
            widget: list
            required: false
            fields:
              - { label: Reference, name: reference, widget: string, hint: "Example: Psalm 119:105–106" }
              - { label: Verse text, name: text, widget: text, hint: "Paste the verses as you want them to appear." }
              - { label: Translation, name: translation, widget: string, required: false, default: CSB }
